# CI for the fork. It checks formatting, vet, the Go tests with the race detector (on Linux this includes the C client
# against the server), known vulnerabilities in the Go module and its standard library, secrets in the full history,
# the NAT lab in Docker, that docs/features.md matches docs/features.tsv, that the README art in docs/img/ matches a
# fresh render, and that site/ matches what tools/site.py builds and its script tests pass. The desktop app module in app/
# has its own job. It does not check Windows beyond the tests. The C client is run only on Linux; on Windows it is
# compiled and linked with MSVC and not run.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.22'
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l server)"
      - name: vet
        run: go vet ./...
      # On Linux this also builds client/test_psnr.c and runs it against the
      # server (TestCClient); it skips where no C compiler is on PATH. The release script tests skip when sh, awk or diff
      # is missing, so they are required too: a skip on this runner would mean they no longer protect the release.
      # -race needs cgo, which the Windows runner has no C compiler for.
      - name: test
        if: runner.os == 'Linux'
        run: >-
          python3 tools/check_conformance.py
          --require github.com/sp00nznet/psnr/server:TestCClient
          --require github.com/sp00nznet/psnr/server:TestCheckReleaseAssets
          --require github.com/sp00nznet/psnr/server:TestReleaseAssetListsAgree
          --require github.com/sp00nznet/psnr/server:TestReleaseCheckWorkflow
          -- go test -race -json ./...
      - name: test (Windows)
        if: runner.os == 'Windows'
        run: go test -v ./...
      # The C client with MSVC: compiled and linked only, never run. vcvars64.bat comes from the Visual Studio install that
      # vswhere.exe reports; each command ends the step if it fails (cmd keeps only the last exit code otherwise).
      - name: C client (MSVC compile only)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /W4 /std:c11 /Iclient /c client\psnr.c || exit /b 1
          cl /nologo /W4 /std:c11 /Iclient client\psnr.c client\examples\minimal.c /Fe:minimal.exe ws2_32.lib || exit /b 1
      # The install scripts against a fake release (no network): the shell script under dash and bash, the PowerShell script
      # under PowerShell 7 on both systems.
      - name: install script tests (sh)
        if: runner.os == 'Linux'
        run: |
          shellcheck -s sh scripts/install.sh scripts/test-install.sh
          dash scripts/test-install.sh dash
          bash scripts/test-install.sh bash
      - name: install script tests (PowerShell)
        shell: pwsh
        run: ./scripts/test-install.ps1
      # The features list: the generated page is current and the data is well formed (python3 is on the runner image).
      - name: features list
        if: runner.os == 'Linux'
        run: |
          python3 tools/repo_check.py
          python3 tools/features.py --check
          python3 tools/site.py --check
          python3 -m unittest -v
      # The website's script: its command logic is tested with Node's own test runner (Node is on the runner image).
      - name: site script tests
        if: runner.os == 'Linux'
        run: node --test tools/terminal.test.js tools/status.test.js tools/action.test.js tools/discuss.test.js tools/nav.test.js
      # The README art: with the pinned Pillow and the fonts checked against their pinned SHA-256, a fresh render must
      # equal docs/img/*.png and tools/art/art.json byte for byte (tools/art/make_art.py).
      - name: art
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/art"
          "$RUNNER_TEMP/art/bin/pip" install --quiet --only-binary=:all: pillow==12.3.0
          "$RUNNER_TEMP/art/bin/python" tools/art/make_art.py --fetch-fonts
          "$RUNNER_TEMP/art/bin/python" tools/art/make_art.py --check
          "$RUNNER_TEMP/art/bin/python" -m unittest -v tools.art.test_make_art

  # The desktop app: a separate Go module in app/ (Go 1.26) whose dependencies are the ones listed in app/README.md. The
  # conformance test builds ../server and runs it on loopback ports. A new dependency has to show up as a go.mod change
  # that a person reads: the root module must keep no `require` lines, and the app builds with -mod=readonly.
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: app/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: verify modules
        run: go mod verify
      - name: vet
        run: go vet -mod=readonly ./...
      - name: test
        if: runner.os == 'Linux'
        run: >-
          python ../tools/check_conformance.py
          --require github.com/undecuple/re-psn/app/internal/client:TestConformanceRoomsAndScores
          --require github.com/undecuple/re-psn/app/internal/client:TestConformanceRelayRoute
          --require github.com/undecuple/re-psn/app/internal/client:TestConformanceErrors
          --require github.com/undecuple/re-psn/app/internal/client:TestConformanceHeartbeatReportsRTT
          -- go test -mod=readonly -race -json ./...
      - name: test (Windows)
        if: runner.os == 'Windows'
        run: >-
          python ../tools/check_conformance.py
          --require github.com/undecuple/re-psn/app/internal/client:TestConformanceRoomsAndScores
          --require github.com/undecuple/re-psn/app/internal/client:TestConformanceRelayRoute
          --require github.com/undecuple/re-psn/app/internal/client:TestConformanceErrors
          --require github.com/undecuple/re-psn/app/internal/client:TestConformanceHeartbeatReportsRTT
          -- go test -mod=readonly -json ./...
      - name: cross-build
        if: runner.os == 'Linux'
        run: |
          GOOS=windows go build -mod=readonly ./...
          GOOS=darwin go build -mod=readonly ./...
      - name: the server module has no dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          if grep -qE '^[[:space:]]*require' go.mod; then
            echo "go.mod has a require line: the server module is meant to stay standard-library only" >&2
            exit 1
          fi

  # Known vulnerabilities (Go vulnerability database) in the code that is built and in the standard library it is
  # built with. Runs on a current Go so a fixed standard library is the one that is checked.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: govulncheck (app)
        working-directory: app
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Secrets in the whole history. The scanner is a pinned release whose checksum is verified before it runs.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 --verbose .

  # Players behind NATing routers, in Docker: lab/README.md.
  nat-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: lab/run.sh
        run: sh lab/run.sh
