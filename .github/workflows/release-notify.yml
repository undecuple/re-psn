name: release-notify

# Posts one message to the project's Discord channel when a release is published (pre-releases too).
# The webhook URL lives only in the repository secret DISCORD_RELEASE_WEBHOOK; without it (forks) the job does nothing.
# The post pings only the project's own Discord role (ROLE, a public ID, not a secret); nothing else can be pinged.

on:
  release:
    types: [published]

permissions: {}

jobs:
  discord:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post the release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          BODY: ${{ github.event.release.body }}
          ROLE: '1572342310191243445'
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DISCORD_RELEASE_WEBHOOK is not set; no message sent."
            exit 0
          fi
          kind="release"
          [ "$PRERELEASE" = "true" ] && kind="pre-release"
          # allowed_mentions lists only ROLE and parse is empty: the message can ping that one role and nobody else
          # (never @everyone, @here or a person), whatever the release title or notes say.
          jq -n --arg tag "$TAG" --arg url "$URL" --arg kind "$kind" --arg body "$BODY" --arg role "$ROLE" '{
            username: "re-psn",
            thread_name: (("re-psn " + $tag) | .[0:100]),
            content: ("<@&" + $role + ">"),
            allowed_mentions: {parse: [], roles: [$role]},
            embeds: [{
              title: ("re-psn " + $tag + " is out"),
              url: $url,
              description: (
                (if ($body | gsub("\\s"; "") | length) == 0
                  then "A new " + $kind + " is available. Read the changes on the release page."
                  else ($body | gsub("\\r"; "") | .[0:1800]) + (if ($body | length) > 1800 then "\n…" else "" end)
                 end)
                + "\n\n[Full notes and download](" + $url + ")"),
              color: 10059413
            }]
          }' > payload.json
          curl --fail-with-body --silent --show-error -H "Content-Type: application/json" --data @payload.json "$WEBHOOK"
          echo "Posted $TAG ($kind)."
