# Release build for the fork. A pushed tag vMAJOR.MINOR.PATCH builds the server and desktop app archives and the x86_64 AppImage, copies the two
# install scripts, and creates a DRAFT PRE-RELEASE with the ten assets for the maintainer to publish; this workflow
# never publishes. A manual run (workflow_dispatch) only builds and keeps the files as a run artifact: the dry run.
# Permissions: read at the top; write only on the job that creates the draft.
# Checks here: on a tag, that the tag is v + VERSION and the version checks pass (scripts/check-release.sh --tag), before
# anything is built; vet and tests, the tag shape, that dist/ holds exactly the ten assets with install.sh and
# install.ps1 equal to the tagged scripts (scripts/check-release.sh --assets, run by release-build.sh), SHA256SUMS
# verified, and that no release for the tag exists yet.
# Network fetch: appimagetool and the type-2 AppImage runtime, from their GitHub releases at fixed tags, checked against
# the SHA-256 pins below before use (scripts/build-appimage.sh checks the same pins again before running anything).
# The notes are scripts/release-notes.sh for VERSION: the CHANGELOG.md entries under that version's heading.
# Not checked here: that the binaries run on Windows or arm64 (they are cross-built), signing (the exe and the AppImage
# are unsigned).
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - name: Tag is v + VERSION
        if: github.ref_type == 'tag'
        run: scripts/check-release.sh --tag "$TAG"
      - name: vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Fetch appimagetool and the AppImage runtime (pinned by SHA-256)
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          d="$RUNNER_TEMP/appimage-tools"; mkdir -p "$d"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$d/appimagetool-x86_64.AppImage" "$APPIMAGETOOL_URL"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$d/runtime-x86_64" "$RUNTIME_URL"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$d/appimagetool-x86_64.AppImage" "$RUNTIME_SHA256" "$d/runtime-x86_64" \
            | sha256sum -c - || { echo "::error::a pinned AppImage tool does not match its SHA-256"; rm -rf "$d"; exit 1; }
      - name: Build archives, the AppImage (with its smoke test), the install scripts and checksums
        run: scripts/release-build.sh "$TAG" --appimage-tools "$RUNNER_TEMP/appimage-tools"
      - name: Release notes
        run: |
          {
            echo "### Files"
            echo
            echo "Each archive holds one self-contained server binary (no installer, no runtime needed), LICENSE, NOTICE.md and an examples folder (settings file, systemd unit, proxy configs)."
            echo "The \`re-psn-app\` archives hold the desktop app (one static binary, LICENSE, NOTICE.md and its README) for the same three platforms. They are not installed by \`install.sh\` or \`install.ps1\`; unpack one by hand."
            echo "The x86_64 AppImage holds the same Linux binary and examples as one runnable file; it needs FUSE to mount, or run it with \`--appimage-extract-and-run\`. It is not signed."
            echo "\`install.sh\` (Linux) and \`install.ps1\` (Windows) are the install scripts from this tag, listed in SHA256SUMS too: download one with SHA256SUMS, check it, read it, then run it (see docs/installing.md)."
            echo "Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Developed with AI agent assistance."
          } > "$RUNNER_TEMP/files.md"
          scripts/release-notes.sh --extra "$RUNNER_TEMP/files.md" "$(tr -d '\r\n' < VERSION)" > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Verify the checksums again
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Create the draft pre-release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; not overwriting"; exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "$TAG" --notes-file dist/notes.md \
            dist/re-psn-"$TAG"-windows-amd64.zip \
            dist/re-psn-"$TAG"-linux-amd64.tar.gz \
            dist/re-psn-"$TAG"-linux-arm64.tar.gz \
            dist/re-psn-app-"$TAG"-windows-amd64.zip \
            dist/re-psn-app-"$TAG"-linux-amd64.tar.gz \
            dist/re-psn-app-"$TAG"-linux-arm64.tar.gz \
            dist/re-psn-"$TAG"-x86_64.AppImage \
            dist/install.sh \
            dist/install.ps1 \
            dist/SHA256SUMS
