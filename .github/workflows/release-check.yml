# Read-only check of a published release: fails when the release and its files disagree. Triggers: a published release, and a
# manual run (input: tag). Nothing is written. Checks: tag shape, published as a pre-release while the version is 0.x,
# title equals the tag, the assets are exactly the ten (the three server archives, the three desktop app archives, the x86_64 AppImage,
# install.sh, install.ps1 and SHA256SUMS), that sha256sum -c passes on the downloaded files, and that install.sh and install.ps1 are byte for byte
# the files at the tag (read through the contents API).
# The historical releases keep their own lists and have no install scripts to compare: v0.2.0 has nine assets (each
# download with its own .sha256 file, and SHA256SUMS), v0.3.0 has five, v0.4.0 has seven (no app archives).
name: release-check
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check (vX.Y.Z)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-check-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Tag shape
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;; esac
          case "$TAG" in *[!0-9v.]*) echo "::error::tag '$TAG' has odd characters"; exit 1 ;; esac
      - name: Release metadata
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$TAG" '
            (.draft | not) and .name == $tag and ((.prerelease) or (.tag_name | startswith("v0") | not))' \
            "$RUNNER_TEMP/release.json" >/dev/null \
            || { echo "::error::release must be published, titled $TAG, and a pre-release while 0.x"; exit 1; }
          want="re-psn-$TAG-linux-amd64.tar.gz re-psn-$TAG-linux-arm64.tar.gz re-psn-$TAG-windows-amd64.zip re-psn-app-$TAG-linux-amd64.tar.gz re-psn-app-$TAG-linux-arm64.tar.gz re-psn-app-$TAG-windows-amd64.zip re-psn-$TAG-x86_64.AppImage install.sh install.ps1 SHA256SUMS"
          INSTALLER_ASSETS=true
          case "$TAG" in
            v0.2.0)
              INSTALLER_ASSETS=false
              want="re-psn-$TAG-linux-amd64.tar.gz re-psn-$TAG-linux-amd64.tar.gz.sha256 re-psn-$TAG-linux-arm64.tar.gz re-psn-$TAG-linux-arm64.tar.gz.sha256 re-psn-$TAG-windows-amd64.zip re-psn-$TAG-windows-amd64.zip.sha256 re-psn-$TAG-x86_64.AppImage re-psn-$TAG-x86_64.AppImage.sha256 SHA256SUMS" ;;
            v0.3.0) INSTALLER_ASSETS=false; want="$(printf '%s' "$want" | sed 's/ re-psn-app-[^ ]*//g; s/ install.sh install.ps1//')" ;;
            v0.4.0) want="$(printf '%s' "$want" | sed 's/ re-psn-app-[^ ]*//g')" ;;
          esac
          echo "INSTALLER_ASSETS=$INSTALLER_ASSETS" >> "$GITHUB_ENV"
          got="$(jq -r '.assets[].name' "$RUNNER_TEMP/release.json" | sort | tr '\n' ' ' | sed 's/ $//')"
          want="$(printf '%s\n' "$want" | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')"
          [ "$got" = "$want" ] || { echo "::error::assets differ"; echo "want: $want"; echo "got:  $got"; exit 1; }
      - name: Download and verify
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          sha256sum -c SHA256SUMS
      - name: The install scripts are the tag's
        if: env.INSTALLER_ASSETS == 'true'
        run: |
          for s in install.sh install.ps1; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/scripts/$s?ref=$TAG" > "$RUNNER_TEMP/tag-$s"
            cmp "$RUNNER_TEMP/assets/$s" "$RUNNER_TEMP/tag-$s" \
              || { echo "::error::$s differs from scripts/$s at $TAG"; exit 1; }
          done
