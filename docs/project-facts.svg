<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 762" width="624" height="914" role="img" aria-label="Project Facts: a label in the style of a drug facts panel, listing what re-psn does, its limits and how to use it" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" shape-rendering="crispEdges" text-rendering="geometricPrecision"><rect width="520" height="762" fill="#fff"/><text x="16" y="39" font-size="30" font-weight="700" text-anchor="start" fill="#000">Project Facts</text><rect x="11" y="46" width="498" height="4" fill="#000"/><text x="16" y="64" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">Serving size: one group of friends</text><rect x="11" y="70" width="498" height="1" fill="#000"/><text x="16" y="86" font-size="12" font-weight="700" text-anchor="start" fill="#000">Active ingredient (in each server)</text><text x="504" y="86" font-size="12" font-weight="700" text-anchor="end" fill="#000">Purpose</text><text x="16" y="102" font-size="12" font-weight="400" text-anchor="start" fill="#000">re-psn server</text><text x="269" y="102" font-size="12" font-weight="400" text-anchor="start" fill="#000">Answers a recompiled PS3 game's</text><text x="269" y="116" font-size="12" font-weight="400" text-anchor="start" fill="#000">matchmaking and leaderboard calls</text><rect x="12" y="51" width="496" height="77" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="155" font-size="13" font-weight="700" text-anchor="start" fill="#000">Uses</text><rect x="17" y="167" width="4" height="4" fill="#000"/><text x="28" y="174" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">keeps rooms, invite codes and leaderboards for your own group</text><rect x="17" y="181" width="4" height="4" fill="#000"/><text x="28" y="188" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">tells each player where the others are; game traffic goes between players</text><rect x="17" y="195" width="4" height="4" fill="#000"/><text x="28" y="202" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">hole punching for players behind routers, with an optional relay for when</text><text x="28" y="216" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">it fails</text><rect x="17" y="223" width="4" height="4" fill="#000"/><text x="28" y="230" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">an optional desktop app to host, play and keep a profile</text><rect x="12" y="137" width="496" height="100" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="262" font-size="13" font-weight="700" text-anchor="start" fill="#000">Warnings</text><text x="17" y="286" font-size="11.5" fill="#000"><tspan font-weight="700">Do not use:</tspan><tspan font-weight="400"> as a public service. There are no accounts and no public</tspan></text><text x="17" y="300" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">instance; you run it for your own group.</text><rect x="12" y="304" width="496" height="1" fill="#000"/><text x="17" y="326" font-size="11.5" fill="#000"><tspan font-weight="700">Not for:</tspan><tspan font-weight="400"> games you do not own. No game files, keys or firmware are included</tspan></text><text x="17" y="340" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">or needed.</text><rect x="12" y="344" width="496" height="1" fill="#000"/><text x="17" y="366" font-size="11.5" fill="#000"><tspan font-weight="700">When using this product:</tspan><tspan font-weight="400"> the status page lists every online ID, so keep it</tspan></text><text x="17" y="380" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">on your own machine (the default) or behind a token. The relay uses the</text><text x="17" y="394" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">host's bandwidth.</text><rect x="12" y="398" width="496" height="1" fill="#000"/><text x="17" y="420" font-size="11.5" fill="#000"><tspan font-weight="700">Ask a maintainer or open an issue if:</tspan><tspan font-weight="400"> players cannot reach each other (a</tspan></text><text x="17" y="434" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">router that picks a new port for every destination cannot be punched) or</text><text x="17" y="448" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">anything looks wrong. Some features are unverified.</text><rect x="12" y="244" width="496" height="214" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="483" font-size="13" font-weight="700" text-anchor="start" fill="#000">Directions</text><rect x="17" y="495" width="4" height="4" fill="#000"/><text x="28" y="502" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">get a release and check it with sha256sum -c SHA256SUMS</text><rect x="17" y="509" width="4" height="4" fill="#000"/><text x="28" y="516" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">run ./re-psn (or the container); it listens on port 36100</text><rect x="17" y="523" width="4" height="4" fill="#000"/><text x="28" y="530" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">players point their game's client at host:36100</text><rect x="17" y="537" width="4" height="4" fill="#000"/><text x="28" y="544" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">on different networks, forward the port or use a VPN</text><rect x="12" y="465" width="496" height="86" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="576" font-size="13" font-weight="700" text-anchor="start" fill="#000">Other information</text><rect x="17" y="588" width="4" height="4" fill="#000"/><text x="28" y="595" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">version 0.8.0; Linux amd64 and arm64, Windows amd64</text><rect x="17" y="602" width="4" height="4" fill="#000"/><text x="28" y="609" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">licence MIT; unofficial, not affiliated with Sony</text><rect x="17" y="616" width="4" height="4" fill="#000"/><text x="28" y="623" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">the Windows build is cross-built and has not been run by us; CI runs the</text><text x="28" y="637" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">server's tests on Windows</text><rect x="12" y="558" width="496" height="86" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="669" font-size="13" font-weight="700" text-anchor="start" fill="#000">Inactive ingredients</text><text x="17" y="688" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">Go standard library, a C client (client/psnr.c), Docker or Podman</text><text x="17" y="702" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">(optional), a Tauri window (optional)</text><rect x="12" y="651" width="496" height="58" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="734" font-size="13" font-weight="700" text-anchor="start" fill="#000">Questions or comments?</text><text x="17" y="753" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">github.com/undecuple/re-psn</text><rect x="12" y="716" width="496" height="44" fill="none" stroke="#000" stroke-width="2"/></svg>
