<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 790" width="420" height="790" role="img" aria-label="Project Facts: a label in the style of a drug facts panel, listing what re-psn does, its limits and how to use it" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif"><rect width="420" height="790" fill="#fff"/><text x="16" y="39" font-size="30" font-weight="700" text-anchor="start" fill="#000">Project Facts</text><rect x="11" y="46" width="398" height="4" fill="#000"/><text x="16" y="64" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">Serving size: one group of friends</text><rect x="11" y="70" width="398" height="1" fill="#000"/><text x="16" y="86" font-size="12" font-weight="700" text-anchor="start" fill="#000">Active ingredient (in each server)</text><text x="404" y="86" font-size="12" font-weight="700" text-anchor="end" fill="#000">Purpose</text><text x="16" y="102" font-size="12" font-weight="400" text-anchor="start" fill="#000">re-psn server</text><text x="214" y="102" font-size="12" font-weight="400" text-anchor="start" fill="#000">Answers a recompiled PS3 game's</text><text x="214" y="116" font-size="12" font-weight="400" text-anchor="start" fill="#000">matchmaking and leaderboard</text><text x="214" y="130" font-size="12" font-weight="400" text-anchor="start" fill="#000">calls</text><rect x="12" y="51" width="396" height="91" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="169" font-size="13" font-weight="700" text-anchor="start" fill="#000">Uses</text><rect x="17" y="181" width="4" height="4" fill="#000"/><text x="28" y="188" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">keeps rooms, invite codes and leaderboards for your own group</text><rect x="17" y="195" width="4" height="4" fill="#000"/><text x="28" y="202" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">tells each player where the others are; game traffic goes</text><text x="28" y="216" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">between players</text><rect x="17" y="223" width="4" height="4" fill="#000"/><text x="28" y="230" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">hole punching for players behind routers, with an optional</text><text x="28" y="244" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">relay for when it fails</text><rect x="17" y="251" width="4" height="4" fill="#000"/><text x="28" y="258" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">an optional desktop app to host, play and keep a profile</text><rect x="12" y="151" width="396" height="114" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="290" font-size="13" font-weight="700" text-anchor="start" fill="#000">Warnings</text><text x="17" y="314" font-size="11.5" fill="#000"><tspan font-weight="700">Do not use:</tspan><tspan font-weight="400"> as a public service. There are no accounts and no</tspan></text><text x="17" y="328" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">public instance; you run it for your own group.</text><rect x="12" y="332" width="396" height="1" fill="#000"/><text x="17" y="354" font-size="11.5" fill="#000"><tspan font-weight="700">Not for:</tspan><tspan font-weight="400"> games you do not own. No game files, keys or firmware are</tspan></text><text x="17" y="368" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">included or needed.</text><rect x="12" y="372" width="396" height="1" fill="#000"/><text x="17" y="394" font-size="11.5" fill="#000"><tspan font-weight="700">When using this product:</tspan><tspan font-weight="400"> the status page lists every online ID, so</tspan></text><text x="17" y="408" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">keep it on your own machine (the default) or behind a token. The</text><text x="17" y="422" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">relay uses the host's bandwidth.</text><rect x="12" y="426" width="396" height="1" fill="#000"/><text x="17" y="448" font-size="11.5" fill="#000"><tspan font-weight="700">Ask a maintainer or open an issue if:</tspan><tspan font-weight="400"> players cannot reach each</tspan></text><text x="17" y="462" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">other (a router that picks a new port for every destination cannot</text><text x="17" y="476" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">be punched) or anything looks wrong. Some features are unverified.</text><rect x="12" y="272" width="396" height="214" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="511" font-size="13" font-weight="700" text-anchor="start" fill="#000">Directions</text><rect x="17" y="523" width="4" height="4" fill="#000"/><text x="28" y="530" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">get a release and check it with sha256sum -c SHA256SUMS</text><rect x="17" y="537" width="4" height="4" fill="#000"/><text x="28" y="544" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">run ./re-psn (or the container); it listens on port 36100</text><rect x="17" y="551" width="4" height="4" fill="#000"/><text x="28" y="558" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">players point their game's client at host:36100</text><rect x="17" y="565" width="4" height="4" fill="#000"/><text x="28" y="572" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">on different networks, forward the port or use a VPN</text><rect x="12" y="493" width="396" height="86" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="604" font-size="13" font-weight="700" text-anchor="start" fill="#000">Other information</text><rect x="17" y="616" width="4" height="4" fill="#000"/><text x="28" y="623" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">version 0.8.0; Linux amd64 and arm64, Windows amd64</text><rect x="17" y="630" width="4" height="4" fill="#000"/><text x="28" y="637" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">licence MIT; unofficial, not affiliated with Sony</text><rect x="17" y="644" width="4" height="4" fill="#000"/><text x="28" y="651" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">the Windows build is cross-built and has not been run by us; CI</text><text x="28" y="665" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">runs the server's tests on Windows</text><rect x="12" y="586" width="396" height="86" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="697" font-size="13" font-weight="700" text-anchor="start" fill="#000">Inactive ingredients</text><text x="17" y="716" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">Go standard library, a C client (client/psnr.c), Docker or Podman</text><text x="17" y="730" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">(optional), a Tauri window (optional)</text><rect x="12" y="679" width="396" height="58" fill="none" stroke="#000" stroke-width="2"/><text x="17" y="762" font-size="13" font-weight="700" text-anchor="start" fill="#000">Questions or comments?</text><text x="17" y="781" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">github.com/undecuple/re-psn</text><rect x="12" y="744" width="396" height="44" fill="none" stroke="#000" stroke-width="2"/></svg>
