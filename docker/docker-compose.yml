services:
  re-psn:
    build:
      context: ..                 # the repository root; the Dockerfile copies go.mod and server/
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      # Any flag is RE_PSN_<FLAG> (the old PSNR_<FLAG> still works); see docs/running.md. Change a port here and in `ports`.
      RE_PSN_ADDR: ":36100"
      # The status page is off unless RE_PSN_HTTP is set. It lists every online ID. To reach it
      # from the host, bind it inside the container and set a token, then publish it below (kept
      # on this machine):
      #   RE_PSN_HTTP: "0.0.0.0:36101"
      #   RE_PSN_HTTP_TOKEN: "<a long random string>"
      # Relay is off by default. Turn it on to carry traffic between players who can't reach each
      # other directly; it uses this server's bandwidth:
      #   RE_PSN_RELAY: "true"
      # Medius compatibility is off. No Medius protocol is implemented yet (docs/medius-scope.md): turned on, the
      # server opens the Medius port and closes every connection. Inside the container it must listen on 0.0.0.0;
      # publish the port below on this machine only, or on a private address:
      #   RE_PSN_MEDIUS: "true"
      #   RE_PSN_MEDIUS_ADDR: "0.0.0.0"
      #   RE_PSN_MEDIUS_PORT: "10071"
    # Players behind a container runtime that rewrites source addresses: see docker-compose.host.yml.
    ports:
      - "36100:36100"             # game clients
      - "36100:36100/udp"         # their P2P sockets' address probes
      # - "127.0.0.1:36101:36101" # status page: this machine only (needs RE_PSN_HTTP above)
      # - "127.0.0.1:10071:10071" # Medius port: this machine only (needs RE_PSN_MEDIUS above)
