# JSON status-token refusals only. Keep the field order emitted by newLogger.
# Raw MESSAGE (-o cat) and the systemd backend's host/re-psn[pid]: prefix work.
# No free-form text, hostnames, game TCP or UDP records are accepted.
[Definition]
failregex = ^(?:(?:[A-Za-z0-9_.-]+ )?re-psn(?:\[[0-9]+\])?: )?\{"time":"[^"\\\x00-\x1f]+","level":"WARN","msg":"status page refused","addr":"<ADDR>","path":"(?:[^"\\\x00-\x1f]|\\(?:["\\/bfnrt]|u[0-9A-Fa-f]{4}))*","reason":"token missing or wrong"\}$
ignoreregex =
# The systemd backend supplies the journal timestamp separately. This also
# keeps offline MESSAGE fixtures from treating a user-controlled path as time.
datepattern = {NONE}
journalmatch = _SYSTEMD_UNIT=re-psn.service
